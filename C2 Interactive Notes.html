function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function idBar(){
  return `<div class="idbar">
    <label>Name<input data-k="name" autocomplete="off"></label>
    <label>Student ID<input data-k="sid" autocomplete="off"></label>
    <label>Group<input data-k="group" placeholder="e.g. CDCS2416B" autocomplete="off"></label>
  </div>`;
}
// keep all identity inputs on every page in sync + persist
document.addEventListener('input',e=>{
  const k=e.target&&e.target.dataset?e.target.dataset.k:null;
  if(k && (k==='name'||k==='sid'||k==='group')){
    IDENT[k]=e.target.value;
    document.querySelectorAll('[data-k="'+k+'"]').forEach(i=>{if(i!==e.target)i.value=e.target.value;});
    try{localStorage.setItem('c2ident',JSON.stringify(IDENT));}catch(_){ }
  }
});
function restoreIdent(){
  try{const s=JSON.parse(localStorage.getItem('c2ident')||'{}');
    ['name','sid','group'].forEach(k=>{if(s[k]){IDENT[k]=s[k];document.querySelectorAll('[data-k="'+k+'"]').forEach(i=>i.value=s[k]);}});
  }catch(_){ }
}

function collectResults(act){
  if(act==='ws'){
    const found=[...document.querySelectorAll('#wslist .word.done')].map(w=>w.textContent);
    return {name:'Word Search', score:`${found.length} / ${WS_WORDS.length} words found`,
      body:`<ul>${WS_WORDS.map(w=>`<li>${w} &nbsp;${found.includes(w)?'&#10003; found':'&#10007; not found'}</li>`).join('')}</ul>`};
  }
  if(act==='drag'){
    let ok=0,total=0;
    document.querySelectorAll('.blank').forEach(b=>{total++;if(b.dataset.filledWord && b.dataset.filledWord===b.dataset.answer)ok++;});
    const rows=[...document.querySelectorAll('.dragsent')].map(s=>`<li>${esc(s.innerText)}</li>`).join('');
    return {name:'Drag the Words', score:`${ok} / ${total} blanks correct`, body:`<ol>${rows}</ol>`};
  }
  if(act==='cw'){
    let ok=0,total=0;
    document.querySelectorAll('.cwcell input').forEach(i=>{total++;if((i.value||'').toUpperCase()===i.dataset.letter)ok++;});
    let grid='<table class="pg">';
    for(let r=0;r<CW.rows;r++){grid+='<tr>';
      for(let c=0;c<CW.cols;c++){
        const inp=document.querySelector(`.cwcell input[data-key="${r}_${c}"]`);
        grid+= inp ? `<td>${esc((inp.value||'').toUpperCase())}</td>` : `<td class="bk"></td>`;
      }
      grid+='</tr>';}
    grid+='</table>';
    return {name:'Crossword', score:`${ok} / ${total} letters correct`, body:grid};
  }
  if(act==='exq'){
    let ok=0;const rows=[];
    document.querySelectorAll('.exq input').forEach(inp=>{
      const i=+inp.dataset.i, got=inp.value||'';
      const good=EXQ[i].accept.some(a=>normF(a)===normF(got));
      if(good)ok++;
      rows.push(`<li>${i+1}. typed <code>${esc(got)||'(blank)'}</code> &mdash; ${good?'&#10003; correct':'&#10007; answer: <code>'+esc(EXQ[i].accept[0])+'</code>'}</li>`);
    });
    return {name:'Excel Formula Challenge', score:`${ok} / ${EXQ.length} correct`, body:`<ol>${rows.join('')}</ol>`};
  }
  return {name:'Activity', score:'', body:''};
}
function makePDF(act){
  if(!IDENT.name || !IDENT.sid){
    const go=confirm("Name and Student ID are empty. Download anyway?");
    if(!go)return;
  }
  const r=collectResults(act);
  const now=new Date();
  const pa=document.getElementById('printArea');
  pa.innerHTML=`
    <div class="pr-title">STA572 Chapter 2 &mdash; ${r.name}</div>
    <div class="pr-meta">
      <div><b>Name:</b> ${esc(IDENT.name)||'__________'}</div>

      <div><b>Group:</b> ${esc(IDENT.group)||'__________'}</div>
      <div><b>Date:</b> ${now.toLocaleDateString()} ${now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <div class="pr-score">Score: ${r.score}</div>
    ${r.body}
    <div class="pr-note">Generated from the STA572 Chapter 2 interactive notes. Use your browser's &ldquo;Save as PDF&rdquo; in the print dialog.</div>`;
  window.print();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---- copy-to-clipboard for R script blocks ---- */
function decorateRBoxes(){
  document.querySelectorAll('.rbox').forEach(box=>{
    const bar=box.querySelector('.rbar');
    if(!bar || bar.querySelector('.rcopy')) return;
    const btn=document.createElement('button');
    btn.type='button'; btn.className='rcopy'; btn.textContent='Copy';
    btn.onclick=()=>copyCode(box, btn);
    bar.appendChild(btn);
  });
}
function copyCode(box, btn){
  const code=box.querySelector('pre').innerText;
  const done=()=>{btn.textContent='Copied!';btn.classList.add('done');
                  setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done');},1500);};
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(()=>fallbackCopy(code,done));
  } else { fallbackCopy(code,done); }
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-9999px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); done(); }catch(_){ }
  document.body.removeChild(ta);
}

function b64ToBlob(b64,type){
  const bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);
  for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type});
}
function downloadWorkbook(){
  try{
    const blob=b64ToBlob(WORKBOOK_B64,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='C2 Practice Workbook.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){ alert('Could not start the download: '+e); }
}

restoreIdent();
decorateRBoxes();
go(0);
